spring.application.name=gest-cabinet-back
spring.config.import=optional:file:.env.local[.properties]

# Connexion à PostgreSQL (charge depuis .env.local si présent, sinon fallback local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_gest_cab}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.jwt.expiration-ms=86400000
